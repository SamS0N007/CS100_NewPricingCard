<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">

    <title>Pricing Card</title>
</head>
<body>
    
    <div class="container py-5">
  <div class="row g-4">
    
    <!-- Card 1 -->
    <div class="col-md-6">
      <div class="card rounded-4 shadow-lg border-0 mb-5 p-3">
        <div class="card-body">
          <div>
            <h4 class="fw-bold">Free</h4>
            <p class="text-muted ">For freelancers</p>
          </div>
          <h2 class="fs-1 fw-bold mt-4 mb-5">$0</h2>
          <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-2">
            <li class="list-group-item border-0"><i class="bi bi-check2"></i> Single User</li>
            <li class="list-group-item border-0"><i class="bi bi-check2"></i> 10 Downloads per Month</li>
            <li class="list-group-item border-0"><i class="bi bi-check2"></i> Faster Files</li>
            <li class="list-group-item border-0"><i class="bi bi-check2"></i> 25 Custom Packs</li>
          </ul>
          <div class="d-grid">
            <button class="btn btn-dark mt-5 mb-4 py-2 fw-semibold">Subscribe</button>
          </div>
        </div>
      </div>
    </div>

<!-- Card 2 -->
<div class="card col-md-6 rounded-4 shadow-lg border-0 mb-5" data-bs-theme="dark" >  
    <div class="card-body card-body d-flex flex-column">
    <div>
    <h4 class="fw-bold">Pro</h4>
    <p class="text-muted">For Agencies</p>
    </div>
        
        <h2 class="fs-1 fw-bold text-white mt-4 mb-5">$100</h2>
        
        <ul class="list-group list-group-flush fs-5 mb-5 vstack gap-2">
          <li class="list-group-item border-0 bg-transparent text-white p-0">
            <i class="bi bi-check2 me-2"></i>Unlimited Users
          </li>
          <li class="list-group-item border-0 bg-transparent text-white p-0">
            <i class="bi bi-check2 me-2"></i>Unlimited Downloads
          </li>
          <li class="list-group-item border-0 bg-transparent text-white p-0">
            <i class="bi bi-check2 me-2"></i>Fully Editable Files
          </li>
          <li class="list-group-item border-0 bg-transparent text-white p-0">
            <i class="bi bi-check2 me-2"></i>200+ Custom Packs
          </li>
        </ul>
      </div>

      <div class="d-grid mt-auto">
            <button class="btn btn-light mt-5 mb-4 py-2 fw-semibold">Subscribe</button>
      </div>
    </div>
  </div>
</div>
</div> 


</body>
</html>
